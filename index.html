<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4c4fe0" />
    <meta
      name="description"
      content="Create free, high-resolution QR codes for links, Wi-Fi, contacts, events and more. No sign-up, no watermark, and every code is made in your browser."
    />
    <title>QR Code Generator</title>
    <script>
      // Set the color theme before the first paint, so the page never flashes
      // in the wrong colors. Keeps working without JavaScript afterwards.
      ;(function () {
        var theme = 'light'
        try {
          var pref = window.localStorage.getItem('qr-theme')
          if (pref === 'dark') theme = 'dark'
          else if (pref !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
        } catch (e) {
          theme = 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
