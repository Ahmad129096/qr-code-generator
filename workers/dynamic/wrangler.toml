name = "qr-dynamic-redirects"
main = "src/index.ts"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
APP_ORIGIN = "https://qr.example.com"
REDIRECT_HOST = "go.example.com"
TURNSTILE_SITE_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "qr-dynamic"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "CREATE_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "UNLOCK_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["17 3 * * *"]
